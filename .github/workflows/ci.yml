# ==============================================================
# CI Pipeline: Code Quality → Docker Build → Trivy Scan
# ==============================================================
# SAST sudah di-handle oleh CodeQL (workflow terpisah, bawaan GitHub)
# Secret scanning sudah aktif secara otomatis di GitHub Settings
# ==============================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Membatalkan run sebelumnya jika ada push baru di branch yang sama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/minimart-online

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Code Quality (Lint + TypeScript Check)
  # ──────────────────────────────────────────────
  quality-gate:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────
  # Job 2: Docker Build & Push ke GHCR
  # ──────────────────────────────────────────────
  build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: quality-gate  # Tunggu quality gate pass

    permissions:
      contents: read
      packages: write  # Untuk push ke GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN otomatis tersedia, tidak perlu buat secret manual

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag berdasarkan branch
            type=ref,event=branch
            # Tag berdasarkan short SHA commit
            type=sha,prefix=,format=short
            # Tag 'latest' hanya untuk branch main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ──────────────────────────────────────────────
  # Job 3: Container Vulnerability Scan (Trivy)
  # ──────────────────────────────────────────────
  security-scan:
    name: 🔒 Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push  # Scan image yang baru di-push

    permissions:
      security-events: write

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Hanya scan vulnerability CRITICAL dan HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
